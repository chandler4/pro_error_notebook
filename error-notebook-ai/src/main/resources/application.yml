# 错题整理应用 · AI 服务配置（架构 §4.3；敏感项仅环境变量注入，security.md §5）
server:
  port: 8081
  address: 127.0.0.1 # 仅回环（api-contract §7：不对外暴露）

spring:
  application:
    name: error-notebook-ai

app:
  ai:
    # 模型服务（OpenAI Chat Completion 协议，2026-11-12 chandler 确认：智谱 GLM Coding Plan 套餐端点）
    base-url: ${ERRNOTE_AI_BASE_URL:https://open.bigmodel.cn/api/coding/paas/v4}
    api-key: ${ERRNOTE_AI_API_KEY:} # Coding Plan 专用 key（bigmodel.cn「个人编程套餐」页新建；与模型标准 API key 互不通用）；真值不落文件不进代码仓，日志脱敏（TC-S-03）
    model: ${ERRNOTE_AI_MODEL:glm-5.3-flash} # GLM-5.3-Flash：原生多模态（图片输入 image_url），套餐内额度为 GLM-5.3 的 3 倍
    connect-timeout-ms: 5000 # 连接 5s / 读取 90s（2026-11-11 15:38 决策）
    read-timeout-ms: 90000
    # 采样参数（2026-11-12 确认）：思考型模型按官方推荐 temperature=1 / top_p=0.95，
    # 结构化质量由「仅输出严格 JSON」Prompt + few-shot + 防腐层 JSON 校验（失败重试 1 次）保证
    temperature: 1
    top-p: 0.95
    # 思考模式（W-7，2026-11-13 chandler 确认默认 disabled）：错题结构化提取实测 禁用 5.6s 出完整草稿、
    # 默认深思考 168s 超一切超时阶梯（W-5）；如切 enabled 须同步评估阶梯
    thinking-type: disabled
    # BE 静态图片访问（架构 §2.1 链路④：回环拉取处理图，A-2 固化）
    be-base-url: ${ERRNOTE_AI_BE_BASE_URL:http://127.0.0.1:8080}
    # Prompt 模板外置（A-4；api-contract §7.1 草稿字段 + architecture-data §3 枚举；{subjects} 运行时替换）
    prompt:
      system: |
        你是错题整理应用的结构化提取引擎。任务：从用户消息中的错题图片（题目图在前、解答/答题卡图在后）提取错题信息，仅输出严格 JSON 对象，禁止输出任何解释文字与 markdown 代码围栏。
        输出字段（逐一如约，识别不到则给空字符串或空数组）：
        - subject：学科枚举，取值 {subjects}
        - gradeLevel：年级枚举（grade1 至 grade12）
        - questionType：题型枚举（choice / multiChoice / fillBlank / judge / calculation / experiment / essay / application / other）
        - questionStem：题干原文；公式保留 LaTeX，行内用 $...$
        - sourceName：试卷或作业名称
        - questionNumber：题号，字符串类型
        - standardAnswer：标准答案，字符串数组，按空分点顺序
        - knowledgePoints：知识点，字符串数组
        - knowledgeAnalysis：解析原文，保留 LaTeX；图中无解析则空字符串
        - tags：不要输出该字段（标签纯人工标注，系统强制为空数组）
        规则：数字、单位、标点照抄原文；不得新增 JSON 之外的任何字段；只输出一个 JSON 对象，仅输出严格 JSON。
      fewshot: |
        示例（物理填空题，输出仅此一个 JSON 对象）：
        {"subject":"physics","gradeLevel":"grade9","questionType":"fillBlank","questionStem":"…","sourceName":"2026—2027 学年度上学期九年级物理学科素养调研","questionNumber":"14","standardAnswer":["12","1:5"],"knowledgePoints":["串并联电路"],"knowledgeAnalysis":"**步骤1** …… $U = U_1 + U_2 = 12\\,\\mathrm{V}$ ……"}
      subjects: [chinese, math, english, physics, chemistry, biology, politics, history, geography, other]

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
